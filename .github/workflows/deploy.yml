name: Deploy Application

on:
  push:
    branches:
      - affiliate5

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      ######################################################
      # Checkout
      ######################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      ######################################################
      # Verify Static Website
      ######################################################

      - name: Verify Static Website
        run: |
          set -e

          echo "=============================================="
          echo "Static HTML Deployment"
          echo "=============================================="

          if [ ! -f "index.html" ]; then
            echo "ERROR: index.html not found in repository root."
            echo ""
            echo "This deployment is configured as runtime=static."
            echo "A static application must contain index.html."
            exit 1
          fi

          echo "index.html found."
          echo "No Node.js required."
          echo "No npm install required."
          echo "No build step required."

      ######################################################
      # Package Static Website
      ######################################################

      - name: Package Static Website
        run: |
          set -e

          ARCHIVE="release_$(date +%Y%m%d_%H%M%S).tar.gz"
          ARCHIVE_PATH="${RUNNER_TEMP}/${ARCHIVE}"

          echo "=============================================="
          echo "Packaging Static Website"
          echo "=============================================="
          echo "Archive: $ARCHIVE"
          echo "Temporary path: $ARCHIVE_PATH"

          # The archive is created outside the repository.
          # This prevents tar from detecting the archive itself
          # while reading the repository directory.

          tar -czf "$ARCHIVE_PATH" \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="*.tar.gz" \
            .

          # Move the completed archive into the GitHub workspace
          # only after tar has finished creating it.

          mv "$ARCHIVE_PATH" "$GITHUB_WORKSPACE/$ARCHIVE"

          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

          echo ""
          echo "Archive created successfully:"
          ls -lh "$GITHUB_WORKSPACE/$ARCHIVE"

      ######################################################
      # Verify Package
      ######################################################

      - name: Verify Package
        run: |
          set -e

          echo "=============================================="
          echo "Verifying Deployment Archive"
          echo "=============================================="

          if [ -z "${ARCHIVE}" ]; then
            echo "ERROR: ARCHIVE environment variable is empty."
            exit 1
          fi

          if [ ! -f "$GITHUB_WORKSPACE/$ARCHIVE" ]; then
            echo "ERROR: Archive not found:"
            echo "$GITHUB_WORKSPACE/$ARCHIVE"
            exit 1
          fi

          echo "Archive exists:"
          ls -lh "$GITHUB_WORKSPACE/$ARCHIVE"

          echo ""
          echo "Checking archive contents..."

          if ! tar -tzf "$GITHUB_WORKSPACE/$ARCHIVE" | grep -qx "index.html"; then
            echo "ERROR: index.html was not found at the root of the archive."
            echo ""
            echo "Archive contents:"
            tar -tzf "$GITHUB_WORKSPACE/$ARCHIVE"
            exit 1
          fi

          echo "index.html found at archive root."
          echo "Archive verification successful."

      ######################################################
      # Upload Package
      ######################################################

      - name: Copy Package
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "${{ env.ARCHIVE }}"
          target: "/var/www/apps/affiliate5/releases"

      ######################################################
      # Trigger Deployment
      ######################################################

      - name: Trigger Deployment
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            echo "=============================================="
            echo "Deploying affiliate5"
            echo "Release: ${{ env.ARCHIVE }}"
            echo "=============================================="

            sudo /opt/deploy-platform/scripts/deploy.sh \
              "affiliate5" \
              "${{ env.ARCHIVE }}"

            echo ""
            echo "=============================================="
            echo "Deployment Triggered Successfully"
            echo "=============================================="